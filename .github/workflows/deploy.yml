name: Deploy Full Stack App to EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: 🧹 Clean old app files on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "🧹 Removing previous app files..."
            rm -rf /home/ec2-user/app/*

      - name: 📦 Upload new code to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: "."
          target: "/home/ec2-user/app"

      - name: 🚀 Build and deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd /home/ec2-user/app

            echo "📦 Installing frontend dependencies and building React app"
            cd frontend
            rm -rf node_modules dist
            npm ci --legacy-peer-deps
            npm run build

            echo "📁 Deploying frontend to Nginx"
            sudo rm -rf /usr/share/nginx/html/*
            sudo cp -r dist/* /usr/share/nginx/html/

            echo "⚙️ Building Spring Boot app"
            cd ../backend
            chmod +x mvnw
            ./mvnw clean package -DskipTests

            echo "♻️ Restarting backend with systemd"
            sudo systemctl restart backend

            echo "📄 Showing backend log (last 20 lines)"
            sudo journalctl -u backend -n 20 --no-pager
